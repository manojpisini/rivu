# Release pipeline: tag v* → goreleaser (6 targets, archives,
# checksums.txt, SBOM) → cosign keyless signature → upload signature.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install syft (SBOMs in goreleaser)
        uses: anchore/sbom-action/download-syft@v0

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keyless signature over the checksum file: OIDC (id-token above)
      # gives cosign the GitHub identity, no secrets to manage.
      - name: Sign checksums (cosign keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.cert \
            dist/checksums.txt

      - name: Upload signature to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/checksums.txt.sig dist/checksums.txt.cert
