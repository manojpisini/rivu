# Goreleaser configuration — see docs/releasing.md for the manual
# equivalent of this file.
version: 2

project_name: rivu

builds:
  - id: rivu
    main: ./cmd/rivu
    binary: rivu
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - ids:
      - rivu
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

# Signing runs as an explicit cosign keyless step in the tag workflow
# (.github/workflows/release.yml), not through goreleaser `signs`:
# the snapshot pipeline never skips signing (cmd/release.go only skips
# announce/publish/validate), so in-config keyless signing would force
# a sigstore device-flow login on every local `--snapshot` run. In CI
# the OIDC identity is ambient (id-token: write), locally snapshots
# stay unattended and unsigned.

# SBOM (SPDX JSON) per archive, produced with syft; the tag workflow
# installs syft (anchore/sbom-action) and local machines need it on
# PATH (`go install github.com/anchore/syft/cmd/syft@latest`).
sboms:
  - id: syft
    artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
